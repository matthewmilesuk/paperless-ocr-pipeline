version: "3.9"

services:
  web:
    build: .
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - scan-data:/data
      # Mount your GCP service account key read-only into the container.
      # The path here must match GOOGLE_APPLICATION_CREDENTIALS in .env.
      - ${GCP_CREDENTIALS_HOST_PATH:-./gcp-credentials.json}:/run/secrets/gcp-credentials.json:ro
    env_file: .env
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build: .
    command: python worker/entrypoint.py
    volumes:
      - .:/app
      - scan-data:/data
      - ${GCP_CREDENTIALS_HOST_PATH:-./gcp-credentials.json}:/run/secrets/gcp-credentials.json:ro
    env_file: .env
    depends_on:
      - redis
    restart: unless-stopped

  watcher:
    build: .
    command: python watcher/watch.py
    volumes:
      - .:/app
      - scan-data:/data
    env_file: .env
    depends_on:
      - redis
      - web
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # Scan-to-network-folder input share + Paperless-NGX-watched output share.
  # See https://hub.docker.com/r/dperson/samba for the full USER/SHARE syntax.
  samba:
    image: dperson/samba
    ports:
      - "139:139"
      - "445:445"
    environment:
      # TODO: fill in a real username/password below (or via .env).
      - USER=${SAMBA_USER}:${SAMBA_PASSWORD}
      - SHARE=input;/data/input;yes;no;no;${SAMBA_USER}
      - SHARE=output;/data/output;yes;no;no;${SAMBA_USER}
    volumes:
      - scan-data:/data
    restart: unless-stopped

volumes:
  scan-data:
  redis-data:
